<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>classes fixture</title>
  </head>
  <body>
    <!-- Every class the CSS tests look for. Unused animations (pop, slide-*) are left out on purpose:
         their keyframes must not be in the build. -->
    <a href="#main" class="skip-link">Skip to content</a>
    <header class="h-header pt-safe px-safe">header</header>
    <main id="main" class="container-page max-w-page pb-bottom-nav">
      <span class="tone-success bg-tone text-tone-foreground">tone</span>
      <span class="tone-neutral bg-tone-subtle text-tone-subtle-foreground hover:bg-tone-hover"
        >x</span
      >
      <span data-order-status="DELIVERED" class="bg-tone-subtle">Delivered</span>
      <i class="bg-chart-1 bg-chart-8 text-gradient-foreground"></i>
      <p class="animate-fade-in animate-scale-out animate-rise-in animate-shake">anim</p>
      <button class="touch-target touch-target-lg focus-ring focus-ring-inset size-touch">x</button>
      <label class="focus-ring-within"><input /></label>
      <div class="skeleton aspect-banner aspect-portrait"></div>
      <div class="progress-indeterminate"></div>
      <div class="marquee"></div>
      <div class="pb-safe pl-safe pr-safe w-sidebar"></div>
      <h1 class="text-brand-gradient">Glow</h1>
      <section class="bg-brand-gradient max-w-dialog max-w-sheet">banner</section>
      <article class="rich-text"><p>text</p></article>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
