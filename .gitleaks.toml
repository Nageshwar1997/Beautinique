# Secret scan config (TASKS T0.6). CI's `check` job runs gitleaks with this file over the whole history
# of the commit it tests (.github/workflows/ci.yml); any finding fails the job. Run the same scan locally
# with the gitleaks version pinned in ci.yml: `gitleaks git --config .gitleaks.toml --redact .`
#
# There is deliberately no path allow-list (not for docs/, scripts/packages/test/ or .env.example): the
# fake values there (the fake registry's `test-token`, dummy GSTIN/PAN data, local ports and URLs) match
# no rule, and a path allow-list would hide a real key pasted into those files later. Allow-list a
# finding only when it is provably fake, and say why next to it.

title = "Beautinique"
minVersion = "v8.30.1"

# Every built-in gitleaks rule, plus the rule below.
[extend]
useDefault = true

# The built-in rules miss connection URLs that carry a password, and this project uses those services:
# MongoDB Atlas, Valkey (Redis protocol) on Render, CLOUDINARY_URL; Postgres and AMQP for completeness.
[[rules]]
id = "url-with-password"
description = "Connection URL with an embedded password (MongoDB, Valkey/Redis, Postgres, AMQP, Cloudinary)"
regex = '''(?i)\b(?:mongodb(?:\+srv)?|rediss?|valkeys?|postgres(?:ql)?|amqps?|cloudinary)://[^:/\s@'"`]+:([^@/\s'"`]+)@[^\s'"`]+'''
secretGroup = 1
keywords = ["mongodb", "redis", "valkey", "postgres", "amqp", "cloudinary"]

# Placeholders, not passwords: `<password>` in docs and .env.example, `${VALKEY_PASSWORD}` interpolated
# from the environment (docker compose), `{{password}}` templates, `****` masked values.
[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''^(?:<[^>]*>|\$\{[^}]*\}|\{\{[^}]*\}\}|\*+)$''']
