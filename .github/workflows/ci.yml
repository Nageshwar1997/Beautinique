name: CI

on:
  push:
    branches: [main, prerelease, release]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The branch flow (RULES §2): work → prerelease → release → main. main takes only release
      # (final code after a successful release); release takes only prerelease or a hotfix/* branch.
      # The branch names come in through env, never straight into the script (a branch name is
      # chosen by whoever opens the pull request).
      - name: Check the branch flow
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "$BASE:$HEAD" in
            main:release | release:prerelease | release:hotfix/*) ;;
            main:*)
              echo "::error::Pull requests into main come only from release (got '$HEAD'). Open it against prerelease."
              exit 1
              ;;
            release:*)
              echo "::error::Pull requests into release come only from prerelease or hotfix/* (got '$HEAD')."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history: the secret scan reads every commit, not only the tip.
          fetch-depth: 0

      # Secret scan first, so a leak fails the run before anything else. The gitleaks binary is pinned
      # and checked against its SHA-256 (no third-party action, licence or token). It scans every commit
      # reachable from the tested commit (for a pull request: the base branch plus the PR's commits) with
      # .gitleaks.toml. --verbose names the file, commit and rule of a finding, --redact keeps the secret
      # itself out of the public log; any finding exits 1.
      - name: Scan for secrets (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --log-opts="--full-history HEAD" --redact --verbose --no-banner --exit-code 1 .

      # No cache here: setup-node's cache step runs `npm config get cache` with the bundled npm 11,
      # which the repo's devEngines (npm >=12.2.0, onFail error) rejects (EBADDEVENGINES).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # The repo needs npm 12 (devEngines); Node 24 ships npm 11. A global install is not checked
      # against devEngines, so this runs fine with npm 11.
      - run: npm install --global npm@12.2.0

      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - run: npm ci
      # Packages import each other's dist (types too), so build them before lint, typecheck and tests.
      - run: npm run build
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Backend packages test against a real MongoDB replica set and Valkey (Redis): the same compose
      # services as on the laptops (`npm run infra:up`), so CI and local runs see the same servers and
      # limits. Every backend package that needs another service adds it here and in release.yml.
      - name: Start MongoDB, Valkey and Mailpit for the tests
        run: |
          # MongoDB 8.0 needs a workaround on Linux 6.19+ (infra/docker-compose.yml)
          echo "kernel $(uname -r)"
          if ! docker compose -f infra/docker-compose.yml up --detach --wait --wait-timeout 180 mongo valkey mailpit; then
            # compose only says "exited (1)"; the servers' own logs say why
            docker compose -f infra/docker-compose.yml ps --all
            docker compose -f infra/docker-compose.yml logs --no-color --tail 200 mongo valkey mailpit
            exit 1
          fi
      - run: npm test
      # Every check a publish runs (build, tests, package contents, publint, types), nothing published.
      - run: npm run verify -- --all --yes
      - run: npm audit --audit-level=high
