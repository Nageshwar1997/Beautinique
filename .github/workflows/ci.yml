name: CI

on:
  push:
    branches: [main, prerelease, release]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No cache here: setup-node's cache step runs `npm config get cache` with the bundled npm 11,
      # which the repo's devEngines (npm >=12.2.0, onFail error) rejects (EBADDEVENGINES).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # The repo needs npm 12 (devEngines); Node 24 ships npm 11. A global install is not checked
      # against devEngines, so this runs fine with npm 11.
      - run: npm install --global npm@12.2.0

      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - run: npm ci
      # Packages import each other's dist (types too), so build them before lint, typecheck and tests.
      - run: npm run build
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Every check a publish runs (build, tests, package contents, publint, types), nothing published.
      - run: npm run verify -- --all --yes
      - run: npm audit --audit-level=high
