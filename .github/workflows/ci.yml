name: CI

# The rules this workflow follows: docs/OPERATIONS.md §2.
# Pushes run on the long-lived branches only (rule 11: Render and Vercel read the merge commit's checks).
on:
  push:
    branches: [prerelease, release]
  pull_request:

# No rights by default; each job asks only for what it needs (rule 7).
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jobs run side by side and none waits for another (needs) except `check` (rules 1 and 2): Render's
# "After CI checks pass" deploys once every check it sees has passed, and a job that waits may have no
# check yet. The rulesets and Vercel's Deployment Checks name `check`, so it keeps its name and has no
# display name. Build, lint, typecheck, tests and E2E join as jobs here with the new root setup; until
# then the repository holds docs, so guard and the format check are the whole run.
jobs:
  # Every run: the history, the branch flow and the advisories change even when the code does not.
  guard:
    name: guard / secrets, branch flow, audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the secret scan reads every commit, not only the tip.
          fetch-depth: 0

      # The gitleaks binary is pinned and checked against its SHA-256 (no third-party action, licence
      # or token). It scans every commit reachable from the tested commit (for a pull request: the
      # base branch plus the PR's commits) with .gitleaks.toml. --verbose names the file, commit and
      # rule of a finding, --redact keeps the secret itself out of the public log; any finding exits 1.
      - name: Scan for secrets (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --log-opts="--full-history HEAD" --redact --verbose --no-banner --exit-code 1 .

      # No cache here: setup-node's cache step runs `npm config get cache` with the bundled npm, which
      # the repository's devEngines (npm >=12.2.0, onFail error) rejects.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # The check's own tests first, so a broken check cannot pass a wrong pull request.
      - name: Test the branch flow check
        run: node --test .github/scripts/branch-flow.test.mjs

      # The branch flow (rule 3; .github/scripts/branch-flow.mjs). The names come in through env, never
      # straight into the command: whoever opens the pull request names the head branch. A base change
      # (edited) does not rerun this; the ruleset's "up to date" rule makes such a pull request update
      # its branch, which does.
      - name: Check the branch flow
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: node .github/scripts/branch-flow.mjs

      # Node 24 ships npm 11 and devEngines needs npm 12. A global install is not checked against
      # devEngines, so it runs with npm 11.
      - run: npm install --global npm@12.2.0
      # High and critical advisories fail the run (rule 3), read from the lockfile alone.
      - run: npm audit --audit-level=high --package-lock-only

  static:
    name: static / format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@12.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      # From the lockfile (rule 7). Prettier needs no install script, so none runs.
      - run: npm ci --ignore-scripts
      - run: npx prettier --check .

  # The one check the rulesets require and Vercel's Deployment Checks wait for: green only when every
  # job above is.
  check:
    if: ${{ !cancelled() }}
    needs: [guard, static]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
