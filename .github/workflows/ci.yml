name: CI

on:
  push:
    branches: [main, prerelease, release]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A normal run takes 19-29 min; a slow runner (a 4 min Docker image pull, every step ~40% slower)
    # went past 30 min on 2026-11-09. 45 still stops a hung job.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the secret scan reads every commit, not only the tip.
          fetch-depth: 0

      # Secret scan first, so a leak fails the run before anything else. The gitleaks binary is pinned
      # and checked against its SHA-256 (no third-party action, licence or token). It scans every commit
      # reachable from the tested commit (for a pull request: the base branch plus the PR's commits) with
      # .gitleaks.toml. --verbose names the file, commit and rule of a finding, --redact keeps the secret
      # itself out of the public log; any finding exits 1.
      - name: Scan for secrets (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --log-opts="--full-history HEAD" --redact --verbose --no-banner --exit-code 1 .

      # No cache here: setup-node's cache step runs `npm config get cache` with the bundled npm 11,
      # which the repo's devEngines (npm >=12.2.0, onFail error) rejects (EBADDEVENGINES).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # The branch flow (RULES §2): main takes only release, release only prerelease or hotfix/*, and
      # both only from this repository, not a fork (QA-CI-001). Rules and tests: scripts/ci/. The names
      # come in through env, never straight into the command (whoever opens the pull request names
      # the branch). A base change (edited) does not rerun this; the ruleset's "up to date" rule makes
      # such a pull request update its branch, which does.
      - name: Check the branch flow
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: node scripts/ci/bin/branch-flow.ts

      # The repo needs npm 12 (devEngines); Node 24 ships npm 11. A global install is not checked
      # against devEngines, so this runs fine with npm 11.
      - run: npm install --global npm@12.2.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - run: npm ci
      # Packages import each other's dist (types too), so build them before lint, typecheck and tests.
      - run: npm run build
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Backend packages test against a real MongoDB replica set and Valkey (Redis): the same compose
      # services as on the laptops (`npm run infra:up`), so CI and local runs see the same servers and
      # limits. Every backend package that needs another service adds it here and in release.yml.
      - name: Start MongoDB, Valkey and Mailpit for the tests
        run: |
          # MongoDB 8.0 needs a workaround on Linux 6.19+ (infra/docker-compose.yml)
          echo "kernel $(uname -r)"
          if ! docker compose -f infra/docker-compose.yml up --detach --wait --wait-timeout 180 mongo valkey mailpit; then
            # compose only says "exited (1)"; the servers' own logs say why
            docker compose -f infra/docker-compose.yml ps --all
            docker compose -f infra/docker-compose.yml logs --no-color --tail 200 mongo valkey mailpit
            exit 1
          fi
      - run: npm test
      # The apps' E2E (ARCHITECTURE §9.2): the real app on its dev server and the whole backend
      # (scripts/e2e/backend.ts) on the services above, Chromium at 360/768/1280 px, light and dark,
      # axe on every screen (owner, 2026-11-02: Chromium only in CI)
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e --workspace customer
      - run: npm run e2e --workspace admin
      - run: npm run e2e --workspace master
      - name: Keep the E2E traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: |
            frontend/customer/test-results
            frontend/admin/test-results
            frontend/master/test-results
          retention-days: 7
      # Every check a publish runs (build, tests, package contents, publint, types), nothing published.
      - run: npm run verify -- --all --yes
      - run: npm audit --audit-level=high
