name: Publish packages

# The packages' publish flow: docs/OPERATIONS.md §11 rule 7 and docs/tasks/28-packages/TASK.md §3.8.
# Started by hand and only from the release branch. Three jobs, each with only the rights it needs:
# pack (read only, checks and builds the tarballs), publish (no checkout, only the tarballs, npm's
# trusted publishing and provenance) and tag (writes the tags of what was published). No npm token
# lives anywhere: npm trusts this workflow through OIDC. scripts/packages' tests hold these rules
# (workflow.test.ts).
on:
  workflow_dispatch:

# No rights by default; each job asks only for what it needs.
permissions: {}

# Two publishes at once would race for the same versions.
concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  pack:
    name: pack / verify and tarballs
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - run: npm ci --ignore-scripts

      # Verifies every package, refuses a package npm has never seen, and packs a tarball for each
      # version npm does not have yet, with the plan (publish-artifact/plan.json).
      - run: npm run packages:publish -- --ci

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-artifact
          path: publish-artifact
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish / tarballs to npm
    needs: pack
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only the identity npm's trusted publishing asks for; the repository is not read or written.
    permissions:
      id-token: write
    steps:
      # No checkout: this job sees the tarballs and nothing else. The Node version is the one in the
      # root package.json (a test keeps them equal); npm 11.5 or newer does trusted publishing.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-artifact
          path: publish-artifact

      # In dependency order, as the plan lists them. A failure stops here; the next run publishes
      # what is left, and the tag job still tags what did go out.
      - name: Publish the tarballs
        run: |
          jq -r '.[].tarball' publish-artifact/plan.json | while read -r tarball; do
            npm publish "publish-artifact/$tarball" --access public --provenance
          done

  # Runs after the publish job even when it failed midway, so a version this run sent out always
  # gets its tag at the release commit. A version npm already had and the repository has no tag for
  # is only reported: it may have gone out from the owner's laptop, whose tag belongs on the commit
  # it was published from, not on this one.
  tag:
    name: tag / what is on npm
    needs: [pack, publish]
    if: ${{ !cancelled() && needs.pack.result == 'success' && github.ref == 'refs/heads/release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-artifact
          path: publish-artifact

      # npm can take a little while to list a version it has just taken, so each one is asked up
      # to three times; one it still lacks (its publish failed) gets no tag.
      - name: Tag the versions on npm
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          : > tagged.txt
          jq -c '.[]' publish-artifact/tags.json | while read -r entry; do
            name=$(jq -r '.name' <<< "$entry")
            version=$(jq -r '.version' <<< "$entry")
            tag=$(jq -r '.tag' <<< "$entry")
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              continue
            fi
            if [ "$(jq -r '.thisRun' <<< "$entry")" != true ]; then
              echo "::warning::$tag is on npm but has no tag: tag the commit it was published from (git tag $tag <commit>, then git push origin refs/tags/$tag)."
              continue
            fi
            found=''
            for attempt in 1 2 3; do
              if [ "$(npm view "$name@$version" version 2> /dev/null)" = "$version" ]; then
                found=yes
                break
              fi
              [ "$attempt" = 3 ] || sleep 10
            done
            if [ -z "$found" ]; then
              echo "::warning::$name@$version is not on npm, so it gets no tag."
              continue
            fi
            git tag "$tag" "$RELEASE_SHA"
            git push origin "refs/tags/$tag"
            echo "$tag" >> tagged.txt
          done

      # Also after the tag step failed midway, so the tags it did push are listed.
      - name: Summary
        if: ${{ !cancelled() }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          {
            echo "### Tagged from \`$BRANCH\`"
            echo
            if [ -s tagged.txt ]; then sed 's/.*/- `&`/' tagged.txt; else echo "No new tag."; fi
            echo
            echo "Next: open a PR that back-merges \`$BRANCH\` into \`prerelease\` (docs/OPERATIONS.md §2)."
          } >> "$GITHUB_STEP_SUMMARY"
