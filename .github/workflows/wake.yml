name: Wake

# Wakes the free Render service once an hour from 09:00 to 22:00 IST (D-322; docs/OPERATIONS.md §5), so
# the day's jobs and summaries run even on a day nobody opens an app. Not a keep-alive: the service
# sleeps again after 15 idle minutes, and nights stay asleep. It is only the backup pinger (§5, rule 2):
# GitHub runs schedules only from the default branch (release, D-024), so this file works once it is on
# release; GitHub may run them late or drop them under load, and turns them off after 60 days without
# repository activity. cron-job.org and UptimeRobot wake it on time.
on:
  schedule:
    # UTC: 03:30 to 16:30 = 09:00 to 22:00 IST, 14 runs a day
    - cron: '30 3-16 * * *'
  workflow_dispatch:

# No rights (§5, rule 6).
permissions: {}

concurrency:
  group: wake
  cancel-in-progress: false

jobs:
  wake:
    # The live server's address is a repository variable (Settings → Secrets and variables → Actions →
    # Variables → BQ_RENDER_URL, e.g. https://bq-live.onrender.com); without it there is nothing to wake.
    if: vars.BQ_RENDER_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pingers call only /wake or /health, which touch no database (§5, rule 3). A cold start takes up to
      # 90 s (§5, rule 8), so each call may wait 90 s, and failed calls are tried again for up to 2 minutes.
      - name: Call /health on the live server
        env:
          RENDER_URL: ${{ vars.BQ_RENDER_URL }}
          EVENT: ${{ github.event_name }}
        run: |
          # GitHub starts some scheduled runs hours late. Nights stay asleep: a late run outside
          # 09:00-22:59 IST wakes nothing (§5, rule 6).
          # IST = UTC + 5:30 all year (no daylight saving), without relying on the runner's tz data
          ist=$(( $(date -u +%s) + 19800 ))
          hour=$((10#$(date -u -d "@$ist" +%H)))
          if [ "$EVENT" = schedule ] && { [ "$hour" -lt 9 ] || [ "$hour" -gt 22 ]; }; then
            echo "::notice::Scheduled run started at $(date -u -d "@$ist" +%H:%M) IST, outside 09:00-22:59: not waking the server."
            exit 0
          fi
          curl --fail --silent --show-error --output /dev/null --write-out 'HTTP %{http_code} in %{time_total} s\n' \
            --max-time 90 --retry 6 --retry-delay 10 --retry-all-errors --retry-max-time 120 \
            "${RENDER_URL%/}/health"
